name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run Alembic migrations against Neon DB
  # ─────────────────────────────────────────────
  migrate:
    name: 🗄️ Database Migrations (Neon)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "Running database migrations against Neon..."
          python -m alembic upgrade head
          echo "✅ Migrations complete."

  # ──────────────────────────────────────────────────────────────────────
  # Job 2: Trigger Render re-deploy via Deploy Hook (backend auto-deploys
  #         from GitHub, but this is a fallback manual trigger)
  # ──────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering Render deploy..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "✅ Render deploy triggered."

  # ──────────────────────────────────────────────────────────────────────
  # Job 3: Trigger Netlify re-deploy via Build Hook (dashboard)
  # ──────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend (Netlify)
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    env:
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

    steps:
      - name: Trigger Netlify Build Hook
        if: env.NETLIFY_BUILD_HOOK_URL != ''
        run: |
          echo "Triggering Netlify deploy..."
          curl -s -X POST "$NETLIFY_BUILD_HOOK_URL" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "✅ Netlify deploy triggered."
