<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Primary Meta Tags -->
    <title>Nexra | Premium Bulk SMS & Messaging Platform</title>
    <meta name="title" content="Nexra | Premium Bulk SMS & Messaging Platform">
    <meta name="description" content="Nexra is the leading platform for sending Bulk SMS, transactional messages, and managing communications at scale. Fast, reliable, and developer-friendly.">
    <meta name="keywords" content="Nexra, bulk SMS, SMS API, send SMS, transactional SMS, messaging platform, marketing SMS, OTP, mass text, reliable SMS gateway">
    <meta name="author" content="Nexra">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nexra.com/">
    <meta property="og:title" content="Nexra | Premium Bulk SMS & Messaging Platform">
    <meta property="og:description" content="Nexra is the leading platform for sending Bulk SMS, transactional messages, and managing communications at scale. Fast, reliable, and developer-friendly.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://nexra.com/">
    <meta property="twitter:title" content="Nexra | Premium Bulk SMS & Messaging Platform">
    <meta property="twitter:description" content="Nexra is the leading platform for sending Bulk SMS, transactional messages, and managing communications at scale. Fast, reliable, and developer-friendly.">
    <link rel="icon" href="assets/NEXRA_IconAbove.png" type="image/png">

    <!-- Fonts (System Fallback) -->
    <style>
        @font-face {
            font-family: 'Inter';
            src: local('Inter'), local('Segoe UI'), local('Roboto'), local('Helvetica Neue'), Arial, sans-serif;
            font-weight: 400 700;
        }
    </style>

    <!-- Suppress Tailwind CDN Warning -->
    <script>
        const _originalWarn = console.warn;
        console.warn = function(...args) {
            if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) return;
            _originalWarn.apply(console, args);
        };
    </script>

    <!-- Tailwind CSS (Local) -->
    <script src="vendor/tailwind.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        window.addEventListener('load', () => {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        screens: {
                            'xs': '400px',
                        },
                        colors: {
                            primary: {
                                50: '#f0f9ff',
                                100: '#e0f2fe',
                                500: '#3b82f6',
                                600: '#2563eb',
                                700: '#1d4ed8',
                            },
                            midnight: {
                                950: '#020617',
                                900: '#0f172a',
                                800: '#1e293b',
                                700: '#334155',
                                600: '#475569',
                                500: '#64748b',
                                400: '#94a3b8',
                                300: '#cbd5e1',
                                200: '#e2e8f0',
                                100: '#f1f5f9',
                                50: '#f8fafc',
                            }
                        },
                        boxShadow: {
                            'premium': '0 10px 30px -5px rgba(0, 0, 0, 0.3), 0 4px 15px -5px rgba(0, 0, 0, 0.2)',
                            'glow': '0 0 20px -5px rgba(59, 130, 246, 0.5)',
                        }
                    }
                }
            }
        });
    </script>

    <!-- Configurable API URL -->
    <script>
        window.__NEXRA_API_URL__ = 'https://nexra-api.onrender.com/api/v1';
    </script>

    <!-- Core Libraries (Local) -->
    <script src="vendor/react.production.min.js" defer></script>
    <script src="vendor/react-dom.production.min.js" defer></script>
    <script src="vendor/htm.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="vendor/axios.min.js" defer></script>
    <script src="vendor/lucide.min.js" defer></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .dark body {
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(30, 58, 138, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(30, 58, 138, 0.05) 0%, transparent 40%);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .dark ::webkit-scrollbar-thumb {
            background: #334155;
        }

        /* Smooth transitions */
        * {
            transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Loading animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .animate-spin { animation: spin 1s linear infinite; }

        /* Premium Animations */
        @keyframes dropdownPop {
            from { opacity: 0; transform: scale(0.95) translateY(-8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .animate-dropdown-pop {
            animation: dropdownPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: top;
        }

        .rotate-icon {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.45) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
        }
        
        .dark .glass {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        /* Premium card */
        .premium-card {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark .premium-card {
            background: #0f172a; /* midnight-900 */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }

        .premium-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
            border-color: #2563eb;
        }

        .dark .premium-card:hover {
            background: #1e293b; /* midnight-800 */
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px -5px rgba(59, 130, 246, 0.2);
        }

        .app-ready #splash-screen {
            opacity: 0;
            visibility: hidden;
        }

        /* Fixed Splash Screen to prevent layout shift */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        /* Hide scrollbar utility */
        .no-scrollbar::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .no-scrollbar { -ms-overflow-style: none; overflow: auto; }

        /* Auth / login showcase animations */
        @keyframes auth-reveal-up {
            from { opacity: 0; transform: translateY(22px); filter: blur(6px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes auth-gradient-flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes auth-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-11px); }
        }

        @keyframes auth-logo-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 40px -12px rgba(37, 99, 235, 0.12); }
            50% { transform: scale(1.04); box-shadow: 0 28px 50px -10px rgba(37, 99, 235, 0.22); }
        }

        @keyframes auth-orb-drift {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(12px, -16px) scale(1.1); opacity: 0.85; }
        }

        @keyframes auth-slide-left {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes send-packet-1 {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% - 72px), calc(-50% - 56px)) scale(1); }
        }

        @keyframes receive-packet-1 {
            0% { opacity: 0; transform: translate(calc(-50% + 48px), calc(-50% + 36px)) scale(0.4); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes send-packet-2 {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + 78px), calc(-50% - 44px)) scale(1); }
        }

        @keyframes receive-packet-2 {
            0% { opacity: 0; transform: translate(calc(-50% - 56px), calc(-50% + 52px)) scale(0.4); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .auth-reveal {
            opacity: 0;
            animation: auth-reveal-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .auth-delay-1 { animation-delay: 0.06s; }
        .auth-delay-2 { animation-delay: 0.16s; }
        .auth-delay-3 { animation-delay: 0.26s; }
        .auth-delay-4 { animation-delay: 0.38s; }
        .auth-delay-5 { animation-delay: 0.5s; }

        .auth-gradient-text {
            background-size: 200% auto;
            animation: auth-gradient-flow 5s ease-in-out infinite;
        }

        .auth-logo-pulse {
            animation: auth-logo-pulse 4.5s ease-in-out infinite;
        }

        .animate-float {
            animation: auth-float 5s ease-in-out infinite;
        }

        .animate-slide-up {
            animation: auth-reveal-up 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-slide-left {
            animation: auth-slide-left 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .auth-orb-drift {
            animation: auth-orb-drift 9s ease-in-out infinite;
        }

        .auth-safe-footer {
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom, 0px));
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-reveal,
            .auth-gradient-text,
            .auth-logo-pulse,
            .animate-float,
            .animate-slide-up,
            .animate-slide-left,
            .auth-orb-drift {
                animation: none !important;
                opacity: 1 !important;
                filter: none !important;
                transform: none !important;
            }
        }
        /* Splash screen logo sizing */
        .splash-logo { height: 48px; width: auto; }
        </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 dark:text-white transition-colors duration-300">
    <!-- Instant Splash Screen -->
    <div id="splash-screen" class="bg-gray-50 dark:bg-gray-900">
        <div class="text-center flex flex-col items-center justify-center fade-in">
            <img src="assets/NEXRA_IconAbove.png" alt="NEXRA Logo" 
                 class="splash-logo h-12 sm:h-14 mb-5 object-contain drop-shadow-md dark:contrast-125" />
            <div class="w-8 h-8 border-[3px] border-primary-100 dark:border-primary-900/30 border-t-primary-600 dark:border-t-primary-500 rounded-full animate-spin shadow-sm"></div>
        </div>
    </div>

    <div id="root"></div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
