<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXRA - Waitlist Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    },
                    animation: {
                        'gradient': 'gradient 8s linear infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="font-['Inter'] antialiased bg-slate-50 text-slate-900 min-h-screen">

    <!-- Background -->
    <div class="fixed inset-0 -z-10">
        <div
            class="absolute inset-0 bg-gradient-to-br from-purple-100 via-slate-50 to-cyan-100 animate-gradient bg-[length:200%_200%]">
        </div>
        <div class="absolute inset-0" id="particles"></div>
        <div class="bg-noise"></div>
    </div>

    <!-- Nav -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 bg-gradient-to-br from-purple-500 to-cyan-500 rounded-lg shadow-lg shadow-purple-500/20">
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">NEXRA <span
                            class="text-xs font-normal text-slate-400 ml-2 tracking-normal">Admin</span></span>
                </div>
                <a href="index.html"
                    class="text-slate-500 hover:text-slate-900 transition-colors text-sm font-medium">Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="pt-24 px-4 pb-12">
        <div class="max-w-5xl mx-auto">

            <!-- Header -->
            <div class="flex flex-col sm:flex-row justify-between items-end mb-8 gap-4">
                <div>
                    <h1 class="text-3xl font-black mb-2 tracking-tight text-slate-900">Waitlist Entries</h1>
                    <p class="text-slate-600">Manage and view early access signups</p>
                </div>
                <div
                    class="bg-white/50 border border-slate-200 px-4 py-2 rounded-lg flex items-center gap-2 backdrop-blur-md shadow-sm">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-sm font-bold text-slate-600">Total: <span id="total-count"
                            class="text-slate-900">...</span></span>
                </div>
            </div>

            <!-- Table Card -->
            <div class="bg-white/50 backdrop-blur-2xl border border-slate-200 rounded-2xl overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100/50 border-b border-slate-200">
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-20">
                                    Pos</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Email
                                </th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Name
                                    / Company</th>
                                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Date
                                </th>
                                <th
                                    class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-right">
                                    Status</th>
                            </tr>
                        </thead>
                        <tbody id="waitlist-body" class="divide-y divide-slate-200">
                            <!-- Rows will be injected here -->
                            <tr>
                                <td colspan="5" class="px-6 py-12 text-center text-slate-400">
                                    <div class="flex flex-col items-center gap-2">
                                        <div
                                            class="w-6 h-6 border-2 border-purple-500 border-t-transparent rounded-full animate-spin">
                                        </div>
                                        <span class="font-medium">Loading entries...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination / Footer -->
                <div
                    class="px-6 py-4 border-t border-slate-200 flex justify-between items-center text-sm text-slate-500 font-medium">
                    <span id="showing-text">Showing all entries</span>
                    <button onclick="fetchWaitlist()"
                        class="text-purple-600 hover:text-purple-700 transition-colors font-bold">
                        Refresh List
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script src="waitlist.js"></script>
</body>

</html>
