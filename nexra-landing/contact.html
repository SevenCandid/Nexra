<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXRA - Contact Us</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    },
                    animation: {
                        'gradient': 'gradient 8s linear infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="font-['Inter'] antialiased bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Background -->
    <div class="fixed inset-0 -z-10">
        <div
            class="absolute inset-0 bg-gradient-to-br from-purple-100 via-slate-50 to-cyan-100 animate-gradient bg-[length:200%_200%]">
        </div>
        <div class="absolute inset-0" id="particles"></div>
        <div class="bg-noise"></div>
    </div>

    <!-- Nav -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-lg border-b border-slate-200/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 bg-gradient-to-br from-purple-500 to-cyan-500 rounded-lg shadow-lg shadow-purple-500/20">
                    </div>
                    <span class="text-xl font-bold tracking-tight">NEXRA</span>
                </div>
                <a href="index.html"
                    class="text-slate-500 hover:text-slate-900 transition-colors text-sm font-medium">Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="flex-grow pt-32 px-4 pb-20">
        <div class="max-w-5xl mx-auto">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">

                <!-- Contact Info -->
                <div class="flex flex-col justify-center">
                    <h1 class="text-4xl md:text-6xl font-black mb-6 tracking-tight">Get in Touch</h1>
                    <p class="text-xl text-slate-600 mb-12 font-light leading-relaxed">Have questions about NEXRA? We're
                        here to help you get
                        started with the future of SMS marketing.</p>

                    <div class="space-y-8">
                        <div class="flex items-start gap-4">
                            <div
                                class="w-12 h-12 bg-purple-500/10 rounded-xl flex items-center justify-center text-purple-600 shadow-sm shadow-purple-500/5">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900 mb-1 tracking-tight">Email Us</h3>
                                <p class="text-slate-600">support@nexra.com</p>
                                <p class="text-slate-600">sales@nexra.com</p>
                            </div>
                        </div>

                        <div class="flex items-start gap-4">
                            <div
                                class="w-12 h-12 bg-cyan-500/10 rounded-xl flex items-center justify-center text-cyan-600 shadow-sm shadow-cyan-500/5">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900 mb-1 tracking-tight">Office</h3>
                                <p class="text-slate-600">123 Tech Avenue</p>
                                <p class="text-slate-600">Accra, Ghana</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div class="bg-white/50 backdrop-blur-xl border border-slate-200 rounded-2xl p-8 shadow-2xl">
                    <form id="contact-form" onsubmit="handleContactSubmit(event)" class="space-y-4">
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700">Full Name</label>
                            <input type="text" required placeholder="John Doe"
                                class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700">Email Address</label>
                            <input type="email" required placeholder="john@example.com"
                                class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-700">Message</label>
                            <textarea rows="4" required placeholder="How can we help?"
                                class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all"></textarea>
                        </div>

                        <button type="submit"
                            class="btn-shine w-full px-6 py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-slate-900/10 mt-4 tracking-wide">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 border-t border-slate-200 bg-white/50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <!-- Brand -->
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 bg-gradient-to-br from-purple-500 to-cyan-500 rounded-lg shadow-lg shadow-purple-500/20">
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">NEXRA</span>
                </div>

                <!-- Central Links -->
                <div class="flex gap-8">
                    <a href="privacy.html"
                        class="text-slate-500 hover:text-purple-600 transition-colors text-sm font-semibold">Privacy</a>
                    <a href="terms.html"
                        class="text-slate-500 hover:text-purple-600 transition-colors text-sm font-semibold">Terms</a>
                    <a href="contact.html" class="text-purple-600 transition-colors text-sm font-bold">Contact</a>
                </div>

                <!-- Social & Copyright -->
                <div class="flex items-center gap-6">
                    <div class="flex flex-col items-end">
                        <p class="text-slate-400 text-xs font-medium">© 2026 NEXRA</p>
                        <p class="text-[10px] text-slate-400/60 font-medium">Powered by Seven Experience</p>
                    </div>
                    <div class="flex gap-3">
                        <a href="#"
                            class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-purple-500 hover:text-white transition-all">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z" />
                            </svg>
                        </a>
                        <a href="#"
                            class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-purple-500 hover:text-white transition-all">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3"></div>
    <script>
        // Particles
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particles');
            const particleCount = 30;
            const colors = ['rgba(139, 92, 246, 0.5)', 'rgba(6, 182, 212, 0.5)', 'rgba(236, 72, 153, 0.5)'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.position = 'absolute';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animation = `float-particle ${15 + Math.random() * 10}s linear infinite`;
                particle.style.animationDelay = `-${Math.random() * 20}s`;
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(particle);
            }
        });

        // Toast & Form Handling
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'p-4 rounded-xl bg-green-500/10 border border-green-500/30 text-green-400 backdrop-blur-xl flex items-center gap-2 shadow-xl';
            toast.innerHTML = `
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function handleContactSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;

            btn.innerText = 'Sending...';
            btn.disabled = true;
            btn.classList.add('opacity-75');

            // Simulate API call
            setTimeout(() => {
                showToast('Message sent successfully! We\'ll be in touch soon.');
                e.target.reset();
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }, 1500);
        }
    </script>
</body>

</html>
