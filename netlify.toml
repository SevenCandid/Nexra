[build]
  base = "."
  command = "sh build.sh"
  publish = "dist"

# Dashboard SPA redirect — hash-based routing.
# Netlify tries real files first; this only fires for non-existent paths.
# This must NOT catch .js / .css / asset requests, which Netlify serves natively.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Admin SPA redirects
[[redirects]]
  from = "/admin"
  to = "/app/admin.html"
  status = 301

[[redirects]]
  from = "/admin.html"
  to = "/app/admin.html"
  status = 301

# Fallback for the landing page SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/vendor/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
