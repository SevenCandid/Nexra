# Netlify Configuration for NEXRA
# Deploys the frontend dashboard from the nexra-dashboard directory

[build]
  # No build step needed — it's a static vanilla JS app
  publish = "nexra-dashboard"

# Redirect all routes to index.html for hash-based SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/vendor/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
