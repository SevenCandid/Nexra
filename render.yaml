services:
  - type: web
    name: nexra-api
    env: python
    region: ohio
    plan: free
    repo: https://github.com/SevenCandid/Nexra
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port $PORT --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: FRONTEND_URL
        value: https://nexrasms.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://nexra-api.onrender.com/api/v1/auth/google/callback
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: NEXRA
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        value: https://nexrasms.netlify.app
      - key: ADMIN_REGISTRATION_KEY
        sync: false
